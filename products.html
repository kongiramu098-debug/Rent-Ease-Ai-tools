{% extends "rentals/base.html" %}{% block content %}
<form class="row g-2 mb-4">
<div class="col-md-3"><input name="q" value="{{ f.q }}" class="form-control" placeholder="Name or brand"></div>
<div class="col-md-3"><select name="category" class="form-select"><option value="">All categories</option>
{% for c in categories %}<option {% if f.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
<div class="col-md-2"><input name="max_price" value="{{ f.max_price }}" class="form-control" placeholder="Max ₹/day"></div>
<div class="col-md-2"><input name="city" value="{{ f.city }}" class="form-control" placeholder="City"></div>
<div class="col-md-2"><button class="btn btn-rent w-100">Filter</button></div></form>
<div class="row g-3">{% for p in products %}{% include "rentals/_card.html" %}{% empty %}<p class="text-muted">Nothing matches. Clear a filter or raise the price limit.</p>{% endfor %}</div>
{% endblock %}
