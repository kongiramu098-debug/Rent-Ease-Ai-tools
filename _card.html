<div class="col-sm-6 col-lg-3"><div class="card h-100">
{% if p.image_url %}<img class="thumb" src="{{ p.image_url }}" alt="{{ p.name }}">{% else %}<div class="thumb">{{ p.category|slice:":1" }}</div>{% endif %}
<div class="card-body d-flex flex-column">
<h6 class="mb-1">{{ p.name }}</h6>
<div class="text-muted small mb-2">{{ p.category }} · {{ p.shop.name }}, {{ p.shop.city }}</div>
<div class="price mb-2">₹{{ p.daily_price|floatformat:0 }}/day <span class="text-muted small fw-normal">+ ₹{{ p.security_deposit|floatformat:0 }} deposit</span></div>
<a class="btn btn-rent btn-sm mt-auto" href="{% url 'product' p.pk %}">Check dates and book</a>
</div></div></div>
